name: Batch Scoring & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly at 06:00 UTC every Monday (Weekly Batch Inference)
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  test-and-score:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      NUM_ACCOUNTS: "1000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Synthetic Data & Build Warehouse
        run: |
          python data/generate_fintech_data.py
          python src/ingestion.py

      - name: Run Pytest Quality Assurance Tests
        run: |
          pytest tests/ -v

      - name: Train Models & Run Financial Optimization
        run: |
          python src/train_churn.py
          python src/train_clv.py
          python src/explainability.py

      - name: Execute Weekly Batch Inference Pipeline
        run: |
          python src/score_batch.py

      - name: Upload Scored Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: batch-scoring-results
          path: |
            models/churn_metadata.json
            models/shap_global_summary.json
